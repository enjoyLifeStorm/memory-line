name: memory-line

services:
  app:
    image: memory-line:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-line-app
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    volumes:
      # H2 数据库持久化（重要：重启后数据不丢失）
      - ./data:/app/temp/data
      - ./logs:/app/temp/logs
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.memory-line.rule: "Host(`study.lifestorm.top`)"
      traefik.http.routers.memory-line.entrypoints: websecure
      traefik.http.routers.memory-line.tls: "true"
      traefik.http.routers.memory-line.tls.certresolver: ali
      traefik.http.services.memory-line.loadbalancer.server.port: "8088"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
