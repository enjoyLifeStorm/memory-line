server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: memory-line
  datasource:
    url: jdbc:h2:file:./temp/data/memory_line;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      # 生产环境安全加固：关闭公网直接访问 H2 Web 控制台
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  config: classpath:logback-spring.xml
